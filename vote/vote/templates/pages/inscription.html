{% extends "base.html" %}

{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — ICAB Vote</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="font-sans antialiased min-h-screen flex items-center justify-center hero-bg relative overflow-hidden px-6">

  <!-- Décor -->
  <div class="hero-decor hero-decor-1"></div>
  <div class="hero-decor hero-decor-2"></div>
  <div class="hero-decor hero-decor-3"></div>

  <main class="w-full max-w-md relative z-10 anim-fade-up">

    <!-- HEADER -->
    <div class="flex flex-col items-center mb-10 text-center">
      <div class="w-16 h-16 rounded-2xl bg-white shadow-2xl flex items-center justify-center mb-4">
        <span class="text-brand-950 text-xl font-black pt-0.5">ICAB</span>
      </div>

      <h1 class="text-white text-3xl font-black italic font-display tracking-tight">
        Créer un compte
      </h1>

      <p class="text-blue-100/60 text-xs font-bold uppercase tracking-[0.2em] mt-2">
        Bafoussam • Session 2026
      </p>
    </div>

    <!-- CARD -->
    <div class="card">

      <form method="POST" class="space-y-6">
        {% csrf_token %}

        <!-- NOM -->
        <div>
          <label class="label">Nom complet</label>
          <input type="text" name="nom" placeholder="Ex: Sandra Towa" class="input">
        </div>

        <!-- IDENTIFIANT -->
        <div>
          <label class="label">Identifiant étudiant</label>
          <input type="text" name="username" placeholder="Ex: ICAB-2024-XXX" class="input">
        </div>

        <!-- EMAIL -->
        <div>
          <label class="label">Email</label>
          <input type="email" name="email" placeholder="exemple@mail.com" class="input">
        </div>

        <!-- PASSWORD -->
        <div>
          <label class="label">Mot de passe</label>
          <input type="password" name="password1" placeholder="••••••••" class="input">
        </div>

        <!-- CONFIRM PASSWORD -->
        <div>
          <label class="label">Confirmer mot de passe</label>
          <input type="password" name="password2" placeholder="••••••••" class="input">
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn">
          Créer mon compte
        </button>

      </form>

      <!-- FOOTER -->
      <div class="mt-10 pt-6 border-t border-gray-100 text-center">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
          Déjà inscrit ?
        </p>

        <a href="{% url 'login' %}" class="text-sm font-black text-brand-700 hover:text-brand-900 transition-colors underline underline-offset-4">
          Connectez-vous
        </a>
      </div>

    </div>

    <!-- RETOUR -->
    <a href="#" class="flex items-center justify-center gap-2 mt-8 text-blue-100/50 hover:text-white text-xs font-bold transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
      Retour au portail
    </a>

  </main>

</body>
</html>
