{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Gestion Candidats | ICAB Bafoussam{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Instrument Serif', serif;
      --color-brand-50: #eff6ff;
      --color-brand-100: #dbeafe;
      --color-brand-200: #bfdbfe;
      --color-brand-500: #3b82f6;
      --color-brand-600: #2563eb;
      --color-brand-700: #1d4ed8;
      --color-brand-800: #1e40af;
      --color-brand-900: #1e3a8a;
      --color-brand-950: #0d2054;
    }
    .sidebar-link-active {
      @apply bg-brand-800 text-white shadow-md shadow-black/20;
    }
  </style>
</head>

<body class="font-sans bg-gray-50 text-gray-900 antialiased h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-72 bg-brand-950 text-blue-100/60 hidden lg:flex flex-col shrink-0 border-r border-white/5">
  
    <div class="p-8 pb-10">
      <a href="{% url 'home' %}" class="flex items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shadow-lg">
          <span class="text-brand-950 text-xs font-black tracking-tight">ICAB</span>
        </div>
        <div>
          <p class="text-white text-sm font-bold tracking-tight leading-none mb-1">Admin Panel</p>
          <p class="text-[10px] font-bold text-blue-400/60 uppercase tracking-widest">Election 2026</p>
        </div>
      </div>
    </div>
  </a>
    <nav class="flex-grow px-4 space-y-1.5 overflow-y-auto">
      <p class="px-4 text-[10px] font-bold text-blue-100/30 uppercase tracking-widest mb-4">Général</p>
      
      <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/5 hover:text-white transition-all group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span class="text-sm font-bold">Tableau de bord</span>
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/5 hover:text-white transition-all group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-sm font-bold">Élection en cours</span>
      </a>

      <a href="admin_candidat.html" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl sidebar-link-active group transition-all">
        <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-sm font-bold">Candidats</span>
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/5 hover:text-white transition-all group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-sm font-bold">Électeurs</span>
      </a>

      <div class="pt-6">
        <p class="px-4 text-[10px] font-bold text-blue-100/30 uppercase tracking-widest mb-4">Système</p>
        
        <!-- Ton lien Scrutin conservé -->
        <a href="{% url 'liste_scrutins' %}" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/5 hover:text-white transition-all group">
          <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <span class="text-sm font-bold">Scrutins</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-2xl hover:bg-white/5 hover:text-white transition-all group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span class="text-sm font-bold">Paramètres</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- MAIN AREA -->
  <main class="flex-grow overflow-y-auto bg-gray-50 flex flex-col">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
