{% extends "pages/admin_dashboard/base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-500 to-indigo-700 px-8 py-7 text-white">

            <h1 class="text-3xl font-bold">
                Modifier le scrutin
            </h1>

            <p class="text-indigo-100 mt-2 text-sm">
                Mettre à jour les informations du scrutin
            </p>

        </div>

        <!-- Form -->
        <div class="p-8">

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <!-- Titre -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Titre du scrutin
                    </label>

                    {{ form.titre }}
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Description
                    </label>

                    {{ form.description }}
                </div>

                <!-- Dates -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Date de début
                        </label>

                        {{ form.date_debut }}
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Date de fin
                        </label>

                        {{ form.date_fin }}
                    </div>

                </div>

                <!-- Statut -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Statut
                    </label>

                    {{ form.statut }}
                </div>

                <!-- Boutons -->
                <div class="flex items-center justify-end gap-4 pt-4">

                    <a
                        href="{% url 'users:liste_scrutins' %}"
                        class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-100 transition-all font-medium"
                    >
                        Annuler
                    </a>

                    <button
                        type="submit"
                        class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition-all shadow-lg shadow-indigo-200"
                    >
                        Enregistrer les modifications
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
