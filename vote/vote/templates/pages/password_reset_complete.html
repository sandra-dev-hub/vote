{% extends "base.html" %}

{% block title %}Mot de passe modifie | ICAB{% endblock %}

{% block content %}
<div class="min-h-screen hero-mesh flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md bg-white/95 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-2xl text-center">
    <div class="w-16 h-16 mx-auto mb-5 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center">
      <span class="text-3xl">✓</span>
    </div>
    <h2 class="text-2xl font-black text-gray-900 mb-3">Mot de passe mis a jour</h2>
    <p class="text-gray-600 mb-8">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
    <a href="{% url 'users:login' %}" class="inline-block px-5 py-3 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-bold">
      Aller a la connexion
    </a>
  </div>
</div>
{% endblock %}
