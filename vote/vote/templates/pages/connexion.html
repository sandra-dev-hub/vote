{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion | ICAB Bafoussam</title>
  <link href="{% static 'css/output.css' %}" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="font-sans antialiased h-screen flex items-center justify-center hero-mesh relative overflow-hidden px-6">

  <!-- Background ornaments -->
  <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle, white 1px, transparent 1px); background-size: 32px 32px;"></div>

  <main class="w-full max-w-md relative z-10 anim-slide-up">
    
    <div class="flex flex-col items-center mb-10 text-center">
      <div class="w-16 h-16 rounded-2xl bg-white shadow-2xl flex items-center justify-center mb-4 transform hover:rotate-6 transition-transform">
        <span class="text-brand-950 text-xl font-black">ICAB</span>
      </div>
      <h1 class="text-white text-3xl font-black italic font-display tracking-tight">Espace de vote</h1>
      <p class="text-blue-100/60 text-xs font-bold uppercase tracking-[0.2em] mt-2">Bafoussam • Session 2026</p>
    </div>

    <div class="bg-white/95 backdrop-blur-xl p-8 md:p-10 rounded-[2.5rem] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] border border-white/20">
      
      <form method="POST" action="{% url 'connexion' %}" class="space-y-6">
        {% csrf_token %}

        {% if messages %}
          {% for message in messages %}
            <div class="p-4 rounded-2xl text-sm {% if 'error' in message.tags %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <!-- Identifiant étudiant -->
        <div class="space-y-2">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Identifiant étudiant</label>
          <div class="relative">
            <input type="text" name="student_id" value="{{ request.POST.student_id|default:'' }}" 
                   class="w-full px-5 py-4 bg-gray-50 border border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-100 focus:outline-none transition-all text-sm font-semibold" 
                   placeholder="Ex: ICAB-2026-XXX" required />
          </div>
        </div>

        <!-- Mot de passe avec toggle œil -->
        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Mot de passe</label>
            <a href="{% url 'password_reset_request' %}" class="text-blue-600 hover:text-blue-700 font-medium text-sm">OUBLIÉ ?</a>
          </div>
          
          <div class="relative">
            <input type="password" id="password" name="password"
                   class="w-full px-5 py-4 bg-gray-50 border border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-100 focus:outline-none transition-all text-sm font-semibold" 
                   placeholder="••••••••" required />
            
            <button type="button" onclick="togglePassword()" 
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-600 transition-colors">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" width="20" height="20">
                <path id="eye-path" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5 16.477 5 20.268 7.943 21.542 12 20.268 16.057 16.477 19 12 19 7.523 19 3.732 16.057 2.458 12z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3 px-1">
          <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded-md border-gray-200 text-brand-600 focus:ring-brand-500/20" />
          <label for="remember" class="text-xs font-bold text-gray-500 cursor-pointer">Rester connecté</label>
        </div>

        <button type="submit" 
                class="w-full py-5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-2xl shadow-xl shadow-brand-200 transition-all hover:shadow-2xl hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98]">
          Ouvrir ma session
        </button>
      </form>

      <div class="mt-10 pt-8 border-t border-gray-100 text-center">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Nouveau sur la plateforme ?</p>
        <a href="{% url 'register' %}" class="text-xs font-black text-brand-700 hover:text-brand-900 underline decoration-brand-200 underline-offset-4">
          Inscrivez-vous maintenant
        </a>
      </div>
    </div>

    <a href="{% url 'home' %}" class="flex items-center justify-center gap-2 mt-8 text-blue-100/50 hover:text-white text-xs font-bold transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
      Retour au portail
    </a>
  </main>

  <!-- Script Toggle Password -->
  <script>
    function togglePassword() {
      const passwordField = document.getElementById('password');
      const eyePath = document.getElementById('eye-path');
      
      if (passwordField.type === "password") {
        passwordField.type = "text";
        eyePath.setAttribute('d', "M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19 12 19c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 2.662 10.066 6.5a10.45 10.45 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l7.07 7.07M15 12a3 3 0 11-6 0 3 3 0 016 0z");
      } else {
        passwordField.type = "password";
        eyePath.setAttribute('d', "M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5 16.477 5 20.268 7.943 21.542 12 20.268 16.057 16.477 19 12 19 7.523 19 3.732 16.057 2.458 12z");
      }
    }
  </script>
</body>
</html>
