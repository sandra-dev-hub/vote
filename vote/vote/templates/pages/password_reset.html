{% extends "base.html" %}

{% block title %}Réinitialisation du mot de passe | ICAB{% endblock %}

{% block content %}
<div class="min-h-screen hero-mesh flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">

        <div class="flex flex-col items-center mb-10 text-center">
            <div class="w-16 h-16 rounded-2xl bg-white shadow-2xl flex items-center justify-center mb-4">
                <span class="text-brand-950 text-xl font-black">ICAB</span>
            </div>
            <h1 class="text-white text-3xl font-black italic font-display tracking-tight">
                Mot de passe oublié ?
            </h1>
        </div>

        <div class="bg-white/95 backdrop-blur-xl p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-white/20">
            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">
                        Identifiant étudiant
                    </label>
                    <input 
                        type="text" 
                        name="identifier"
                        class="w-full px-5 py-4 bg-gray-50 border border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-100 focus:outline-none transition-all text-sm font-semibold"
                        placeholder="Ex: ICAB-2026-XXX"
                        required
                    >
                </div>

                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 block">
                        Comment recevoir le code ?
                    </label>
                    <label class="flex items-center gap-3">
                        <input type="radio" name="delivery_method" value="email" checked>
                        <span>Par Email</span>
                    </label>
                    <label class="flex items-center gap-3">
                        <input type="radio" name="delivery_method" value="sms">
                        <span>Par SMS</span>
                    </label>
                </div>

                <button type="submit"
                        class="mt-8 w-full py-5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-2xl shadow-xl transition-all">
                    Envoyer le code de vérification
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="{% url 'connexion' %}" class="text-brand-700 hover:text-brand-900 text-sm font-bold">
                    ← Retour à la connexion
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
