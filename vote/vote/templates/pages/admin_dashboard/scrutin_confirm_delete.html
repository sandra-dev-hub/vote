{% extends "pages/admin_dashboard/base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-red-500 to-red-700 px-8 py-7 text-white">
            <h1 class="text-3xl font-bold">
                Supprimer le scrutin
            </h1>

            <p class="text-red-100 mt-2 text-sm">
                Cette action est irréversible
            </p>
        </div>

        <!-- Body -->
        <div class="p-8">

            <div class="flex items-center justify-center mb-6">
                <div class="w-20 h-20 rounded-full bg-red-100 flex items-center justify-center">
                    <svg class="w-10 h-10 text-red-600"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                </div>
            </div>

            <div class="text-center mb-8">
                <p class="text-gray-500 text-sm uppercase tracking-widest mb-2">
                    Scrutin sélectionné
                </p>

                <h2 class="text-2xl font-bold text-gray-800">
                    {{ object.titre }}
                </h2>
            </div>

            <form method="POST" class="flex items-center justify-center gap-4">
                {% csrf_token %}

                <button
                    type="submit"
                    class="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold transition-all shadow-lg shadow-red-200"
                >
                    Oui, supprimer
                </button>

                <a
                    href="{% url 'users:liste_scrutins' %}"
                    class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-100 transition-all font-medium"
                >
                    Annuler
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
