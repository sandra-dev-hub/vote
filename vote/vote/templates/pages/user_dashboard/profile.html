{% extends "pages/user_dashboard/user.html" %}

{% block content %}
  <div class="p-6 lg:p-8">
    <div class="max-w-3xl mx-auto">
      <header class="bg-gradient-to-r from-brand-600 to-brand-500 text-white rounded-t-2xl p-6 shadow-md">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-lg bg-white/10 flex items-center justify-center text-xl font-bold">{{ user.email|first|upper }}</div>
          <div>
            <h1 class="text-2xl font-extrabold">{{ user.get_full_name|default:user.email }}</h1>
            <p class="text-sm opacity-90">Profil • {{ user.get_role_display }}</p>
          </div>
        </div>
      </header>
    <form method="post" enctype="multipart/form-data" class="bg-white rounded-b-2xl p-6 border border-t-0 border-gray-100 shadow-sm">
      {% csrf_token %}
      <h2 class="text-lg font-bold mb-4">Mon Profil</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-gray-600">Prénom</label>
          <input name="prenom" value="{{ user.prenom }}" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" />
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">Nom</label>
          <input name="nom" value="{{ user.nom }}" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" />
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">Filière</label>
          <input name="filiere" value="{{ user.filiere }}" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" />
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">Niveau</label>
          <input name="niveau" value="{{ user.niveau }}" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" />
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">Téléphone</label>
          <input name="telephone" value="{{ user.telephone }}" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" />
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">Photo</label>
          <input type="file" name="photo" class="w-full mt-1" />
        </div>
      </div>

      <div class="mt-4">
        <label class="text-xs font-bold text-gray-600">Biographie</label>
        <textarea name="biographie" class="w-full mt-1 rounded-lg border border-gray-200 px-3 py-2" rows="4">{{ user.biographie }}</textarea>
      </div>

      <div class="mt-4 flex justify-end">
        <button type="submit" class="px-4 py-2 bg-brand-700 text-white rounded-lg font-bold">Enregistrer</button>
      </div>
    </form>
  </div>
{% endblock %}
