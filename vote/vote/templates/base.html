{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ICAB Bafoussam — Plateforme de Vote Sécurisé{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <style>
      .toast-container {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        pointer-events: none;
      }
      .toast {
        min-width: 18rem;
        max-width: 26rem;
        border-radius: 1rem;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        padding: 1rem 1.25rem;
        color: #ffffff;
        font-weight: 600;
        pointer-events: auto;
        transform: translateY(-10px);
        opacity: 0;
        animation: toastIn 0.32s ease forwards;
      }
      .toast-success { background: linear-gradient(135deg, #14b8a6, #0f766e); }
      .toast-error   { background: linear-gradient(135deg, #ef4444, #b91c1c); }
      .toast-warning { background: linear-gradient(135deg, #f97316, #c2410c); }
      @keyframes toastIn {
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans bg-white text-gray-900 antialiased overflow-x-hidden min-h-screen flex flex-col">

        <!-- Navbar -->
        {% include "pages/partials/_navbar.html" %}

        <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

        <!-- Contenu principal de la page -->
        <main class="flex-grow">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        {% include "pages/partials/_footer.html" %}

        {% block extra_scripts %}{% endblock %}
</body>
</html>
