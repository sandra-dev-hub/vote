{% extends "../base.html" %}

{% block title %}Réinitialisation du mot de passe | ICAB{% endblock %}

{% block content %}
<div class="min-h-screen hero-mesh flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="flex flex-col items-center mb-10 text-center">
            <div class="w-16 h-16 rounded-2xl bg-white shadow-2xl flex items-center justify-center mb-4">
                <span class="text-brand-950 text-xl font-black">ICAB</span>
            </div>
            <h1 class="text-white text-3xl font-black italic font-display tracking-tight">
                Vérification du code
            </h1>
            <p class="text-blue-100/70 text-sm mt-3 text-center">
                Nous avons envoyé un code à 6 chiffres.<br>
                Veuillez le saisir ci-dessous.
            </p>
        </div>

        <div class="bg-white/95 backdrop-blur-xl p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-white/20">
            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">
                        Code de vérification (6 chiffres)
                    </label>
                    <input 
                        type="text" 
                        name="otp"
                        maxlength="6"
                        class="w-full px-5 py-6 bg-gray-50 border border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-100 focus:outline-none transition-all text-2xl font-semibold tracking-[8px] text-center"
                        placeholder="000000"
                        required
                    >
                </div>

                <button type="submit"
                        class="w-full py-5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-2xl shadow-xl transition-all">
                    Vérifier le code
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'password_reset_request' %}" 
                   class="text-brand-700 hover:text-brand-900 text-sm font-bold">
                    ← Renvoyer un code
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
